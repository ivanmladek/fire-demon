apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-service
  namespace: firecrawl-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-service
  template:
    metadata:
      labels:
        app: playwright-service
    spec:
      containers:
      - name: playwright-service
        image: gcr.io/firecrawl-deployment-410709/playwright-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: firecrawl-config
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      imagePullSecrets:
      - name: docker-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: playwright-service
  namespace: firecrawl-prod
spec:
  type: LoadBalancer
  selector:
    app: playwright-service
  ports:
    - port: 3002
      targetPort: 3000 